<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="utf-8" />
		<style>
			@font-face {
				font-family: Roboto;
				src: url('http://127.0.0.1:5173/node_modules/@fontsource-variable/roboto-mono/files/roboto-mono-latin-wght-normal.woff2');
				font-weight: 100 900;
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				width: 1200px;
				height: 630px;
				padding: 64px;
				background: #140d0a;
				color: #f5f1eb;
				font-family: Roboto, monospace;
				display: flex;
				align-items: center;
				gap: 48px;
				border-bottom: 12px solid #d28a4c;
			}
			main {
				flex: 1;
			}
			.brand {
				font-size: 30px;
				font-weight: 700;
				letter-spacing: 6px;
			}
			h1 {
				font-size: 48px;
				line-height: 1.3;
				margin: 48px 0 24px;
			}
			p {
				font-size: 20px;
				line-height: 1.6;
				color: #cfb28c;
			}
			.tag {
				display: inline-block;
				background: #d28a4c;
				color: #140d0a;
				padding: 12px 20px;
				border-radius: 6px;
				margin-top: 16px;
				font-weight: 700;
			}
			img {
				width: 420px;
				height: 460px;
				object-fit: cover;
				border-radius: 24px;
			}
		</style>
	</head>
	<body>
		<main>
			<div class="brand">KURIO</div>
			<h1>Arte digital.<br />Cultura que é sua.</h1>
			<p>Explore coleções e descubra<br />seu próximo NFT.</p>
			<span class="tag">Marketplace de NFTs · Demonstração</span>
		</main>
		<img
			src="http://127.0.0.1:5173/images/nfts/8459204731e6eba9d474cbc8ebc37071360d3ba5.avif"
			alt="Emerald Ape"
		/>
	</body>
</html>
